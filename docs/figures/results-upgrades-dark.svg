<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 398" role="img" aria-label="Change in held-out test score for eight engine upgrades against the original engine, with 95 percent intervals. Core fixes and the statistical winner check are on by default; section-only edits and an edit-size cap were rejected."><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#c3c2b7;font-size:12px}
.bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
.h{font-size:15.5px;font-weight:600;fill:#f0efec}.sub{font-size:12.5px;fill:#c3c2b7}
.kl{font-size:11.5px;fill:#898781}.kv{font-size:27px;font-weight:600;fill:#f0efec}.kd{font-size:12px;fill:#c3c2b7}.up{fill:#0ca30c;font-weight:600}
.row{font-size:12.5px;fill:#f0efec}.rowb{font-weight:600}.note{fill:#898781;font-size:11.5px}
.tick{font-size:11px;fill:#898781;font-variant-numeric:tabular-nums}.val{font-size:11.5px;fill:#f0efec;font-variant-numeric:tabular-nums}.val2{fill:#c3c2b7}
.grid{stroke:#2c2c2a;stroke-width:1}.axis{stroke:#383835;stroke-width:1}
.link{stroke:#184f95;stroke-width:2;stroke-linecap:round}.ci{stroke-width:2;stroke-linecap:round}
.dot{stroke:#1a1a19;stroke-width:2}.b{fill:#184f95}.a{fill:#3987e5}.g{fill:#898781}.sa{stroke:#3987e5}.sg{stroke:#898781}
.start{fill:#1a1a19;stroke:#898781;stroke-width:1.5}
.tile{fill:none;stroke:#2c2c2a}</style><rect class="bg" x=".5" y=".5" width="759" height="397" rx="10"/><text x="24" y="34" class="h">Every upgrade was measured before it became a default</text><text x="24" y="54" class="sub">Change in held-out test score against the original engine. Only what held up is switched on.</text><text x="24" y="82" class="note">Upgrade</text><text x="584" y="82" class="note">Change</text><text x="640" y="82" class="note">Decision</text><line class="grid" x1="301.95348837209303" x2="301.95348837209303" y1="96" y2="344"/><text x="301.95348837209303" y="360" class="tick" text-anchor="middle">−0.3</text><line class="grid" x1="369.86046511627904" x2="369.86046511627904" y1="96" y2="344"/><text x="369.86046511627904" y="360" class="tick" text-anchor="middle">−0.2</text><line class="grid" x1="437.76744186046506" x2="437.76744186046506" y1="96" y2="344"/><text x="437.76744186046506" y="360" class="tick" text-anchor="middle">−0.1</text><line class="axis" x1="505.6744186046511" x2="505.6744186046511" y1="96" y2="344"/><text x="505.6744186046511" y="360" class="tick" text-anchor="middle">0</text><text x="24" y="115.5" class="row rowb">Core fixes: GEPA pruning, eval cache</text><line class="ci sa" x1="486.66046511627906" x2="535.5534883720929" y1="111.5" y2="111.5"/><circle class="dot a" cx="514.5023255813953" cy="111.5" r="5.5"/><text x="584" y="115.5" class="val">+0.013</text><text x="640" y="115.5" class="row rowb">On by default</text><text x="24" y="146.5" class="row rowb">Core fixes + statistical winner check</text><line class="ci sa" x1="503.6372093023256" x2="526.7255813953489" y1="142.5" y2="142.5"/><circle class="dot a" cx="515.8604651162791" cy="142.5" r="5.5"/><text x="584" y="146.5" class="val">+0.015</text><text x="640" y="146.5" class="row rowb">On by default</text><text x="24" y="177.5" class="row">… + successive halving</text><line class="ci sg" x1="502.9581395348837" x2="530.8" y1="173.5" y2="173.5"/><circle class="dot g" cx="517.2186046511628" cy="173.5" r="5.5"/><text x="584" y="177.5" class="val">+0.017</text><text x="640" y="177.5" class="row">Off: no extra gain</text><text x="24" y="208.5" class="row">… + memory of rejected edits</text><line class="ci sg" x1="486.66046511627906" x2="534.874418604651" y1="204.5" y2="204.5"/><circle class="dot g" cx="513.1441860465117" cy="204.5" r="5.5"/><text x="584" y="208.5" class="val">+0.011</text><text x="640" y="208.5" class="row">Off: no extra gain</text><text x="24" y="239.5" class="row">… + bandit over edit types</text><line class="ci sg" x1="495.48837209302326" x2="518.5767441860465" y1="235.5" y2="235.5"/><circle class="dot g" cx="507.0325581395349" cy="235.5" r="5.5"/><text x="584" y="239.5" class="val">+0.002</text><text x="640" y="239.5" class="row">Off: no extra gain</text><text x="24" y="270.5" class="row">… + counterexample mining</text><line class="ci sg" x1="474.4372093023256" x2="510.4279069767442" y1="266.5" y2="266.5"/><circle class="dot g" cx="492.09302325581393" cy="266.5" r="5.5"/><text x="584" y="270.5" class="val">−0.020</text><text x="640" y="270.5" class="row">Off: scored lower</text><text x="24" y="301.5" class="row">Section edits only</text><line class="ci sg" x1="325.7209302325581" x2="382.7627906976744" y1="297.5" y2="297.5"/><circle class="dot g" cx="353.5627906976744" cy="297.5" r="5.5"/><text x="584" y="301.5" class="val">−0.224</text><text x="640" y="301.5" class="row">Rejected</text><text x="24" y="332.5" class="row">… + cap on edit size</text><line class="ci sg" x1="285.65581395348835" x2="315.5348837209302" y1="328.5" y2="328.5"/><circle class="dot g" cx="301.95348837209303" cy="328.5" r="5.5"/><text x="584" y="332.5" class="val">−0.300</text><text x="640" y="332.5" class="row">Rejected</text><text x="24" y="382" class="note">Dot = mean change over 3 tasks; line = 95% bootstrap interval. “…” rows add one idea on top of the winner check.</text></svg>
.dot{stroke:#1a1a19;stroke-width:2}.b{fill:#184f95}.a{fill:#3987e5}.g{fill:#898781}.sa{stroke:#3987e5}.sg{stroke:#898781}
.start{fill:#1a1a19;stroke:#898781;stroke-width:1.5}
.tile{fill:none;stroke:#2c2c2a}</style><rect class="bg" x=".5" y=".5" width="759" height="397" rx="10"/><text x="24" y="34" class="h">The engine improved its own skill, and the gain holds on examples it never saw</text><text x="24" y="54" class="sub">The skill teaches coding agents when and how to call the optimizer. It was optimized by the engine itself.</text><rect class="tile" x="24" y="74" width="226.66666666666666" height="74" rx="8"/><text x="38" y="95" class="kl">Held-out score of the skill</text><text x="38" y="124" class="kv">0.974</text><text x="38" y="140" class="kd"><tspan class="up">+0.105</tspan> from 0.869 before</text><rect class="tile" x="266.66666666666663" y="74" width="226.66666666666666" height="74" rx="8"/><text x="280.66666666666663" y="95" class="kl">Calls that run, held-out</text><text x="280.66666666666663" y="124" class="kv">100%</text><text x="280.66666666666663" y="140" class="kd">of requests, from 80% before</text><rect class="tile" x="509.3333333333333" y="74" width="226.66666666666666" height="74" rx="8"/><text x="523.3333333333333" y="95" class="kl">Cost of the whole run</text><text x="523.3333333333333" y="124" class="kv">$6.68</text><text x="523.3333333333333" y="140" class="kd">8 rounds, 17 minutes</text><text x="24" y="174" class="row rowb">Score by part (higher is better)</text><text x="641.5" y="174" class="note">Optimized skill</text><circle class="dot a" cx="631.5" cy="170" r="5"/><text x="525.3" y="174" class="note">Original skill</text><circle class="dot b" cx="515.3" cy="170" r="5"/><text x="214" y="198" class="row rowb">Training examples (70%)</text><line class="grid" x1="214" x2="214" y1="212" y2="364"/><text x="214" y="380" class="tick" text-anchor="middle">0.6</text><line class="grid" x1="259.5" x2="259.5" y1="212" y2="364"/><text x="259.5" y="380" class="tick" text-anchor="middle">0.7</text><line class="grid" x1="305" x2="305" y1="212" y2="364"/><text x="305" y="380" class="tick" text-anchor="middle">0.8</text><line class="grid" x1="350.5" x2="350.5" y1="212" y2="364"/><text x="350.5" y="380" class="tick" text-anchor="middle">0.9</text><line class="grid" x1="396" x2="396" y1="212" y2="364"/><text x="396" y="380" class="tick" text-anchor="middle">1.0</text><text x="504" y="198" class="row rowb">Held-out examples (30%)</text><line class="grid" x1="504" x2="504" y1="212" y2="364"/><text x="504" y="380" class="tick" text-anchor="middle">0.6</text><line class="grid" x1="549.5" x2="549.5" y1="212" y2="364"/><text x="549.5" y="380" class="tick" text-anchor="middle">0.7</text><line class="grid" x1="595" x2="595" y1="212" y2="364"/><text x="595" y="380" class="tick" text-anchor="middle">0.8</text><line class="grid" x1="640.5" x2="640.5" y1="212" y2="364"/><text x="640.5" y="380" class="tick" text-anchor="middle">0.9</text><line class="grid" x1="686" x2="686" y1="212" y2="364"/><text x="686" y="380" class="tick" text-anchor="middle">1.0</text><text x="24" y="230" class="row">Picks the skill correctly</text><text x="24" y="244" class="note">trigger F1</text><line class="link" x1="382.35" x2="396" y1="231" y2="231"/><circle class="dot b" cx="382.35" cy="231" r="5.5"/><circle class="dot a" cx="396" cy="231" r="5.5"/><text x="371.35" y="235" class="val val2" text-anchor="end">0.970</text><text x="407" y="235" class="val">1.000</text><circle class="dot a" cx="686" cy="231" r="5.5"/><text x="675" y="235" class="val" text-anchor="end">no change  1.000</text><text x="24" y="268" class="row">Writes a call that runs</text><text x="24" y="282" class="note">validity</text><line class="link" x1="282.25" x2="373.25" y1="269" y2="269"/><circle class="dot b" cx="282.25" cy="269" r="5.5"/><circle class="dot a" cx="373.25" cy="269" r="5.5"/><text x="271.25" y="273" class="val val2" text-anchor="end">0.750</text><text x="384.25" y="273" class="val">0.950</text><line class="link" x1="595" x2="686" y1="269" y2="269"/><circle class="dot b" cx="595" cy="269" r="5.5"/><circle class="dot a" cx="686" cy="269" r="5
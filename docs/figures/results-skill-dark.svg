<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 398" role="img" aria-label="Skill score before and after optimization, on training and held-out examples, by part. Held-out total rose from 0.869 to 0.974."><style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#c3c2b7;font-size:12px}
.bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
.h{font-size:15.5px;font-weight:600;fill:#f0efec}.sub{font-size:12.5px;fill:#c3c2b7}
.kl{font-size:11.5px;fill:#898781}.kv{font-size:27px;font-weight:600;fill:#f0efec}.kd{font-size:12px;fill:#c3c2b7}.up{fill:#0ca30c;font-weight:600}
.row{font-size:12.5px;fill:#f0efec}.rowb{font-weight:600}.note{fill:#898781;font-size:11.5px}
.tick{font-size:11px;fill:#898781;font-variant-numeric:tabular-nums}.val{font-size:11.5px;fill:#f0efec;font-variant-numeric:tabular-nums}.val2{fill:#c3c2b7}
.grid{stroke:#2c2c2a;stroke-width:1}.axis{stroke:#383835;stroke-width:1}

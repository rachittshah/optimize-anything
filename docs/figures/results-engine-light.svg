<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" role="img" aria-label="Held-out test score by task for the starting text, the original engine and the new engine. Mean 0.874 for the original and 0.889 for the new engine, at 0.73 times the cost."><style>
